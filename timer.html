<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Sound Timer</title>
  <style>
    :root {
      --bg: #14161a;
      --surface: #1e2228;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #4f9cff;
      --stop: #e0533d;
      --track: #2c313a;
      --border: #2c313a;
      --shadow: rgba(0, 0, 0, 0.45);
    }
    body.light {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5f6368;
      --accent: #1a73e8;
      --stop: #d93025;
      --track: #e3e6eb;
      --border: #dbdfe5;
      --shadow: rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 20px 56px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      transition: background .25s ease, color .25s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 { font-size: 1.4rem; margin: 0; }

    p.intro { color: var(--muted); margin: 12px 0 0; }

    .theme-toggle {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.15rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .25s ease, border-color .25s ease;
    }
    .theme-toggle:hover { border-color: var(--accent); }

    /* ---- Cycle dial ---- */
    .dial {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 28px auto 8px;
      display: grid;
      place-items: center;
    }
    .dial svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .dial .track { stroke: var(--track); }
    .dial .progress {
      stroke: var(--accent);
      stroke-linecap: round;
    }
    .dial.pulse { animation: pulse .25s ease; }
    @keyframes pulse {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .dial .center {
      position: absolute;
      text-align: center;
      pointer-events: none;
    }
    .dial .count {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .dial .unit { color: var(--muted); font-size: .85rem; }

    /* ---- Controls card ---- */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px 20px;
      box-shadow: 0 6px 24px var(--shadow);
      transition: background .25s ease, border-color .25s ease;
    }
    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .row .label { color: var(--muted); }
    .period-value {
      font-weight: 700;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: var(--track);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid var(--surface);
      box-shadow: 0 1px 5px var(--shadow);
    }
    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid var(--surface);
      box-shadow: 0 1px 5px var(--shadow);
    }
    .ticks {
      position: relative;
      height: 26px;
      margin-top: 6px;
    }
    .ticks span {
      position: absolute;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: .72rem;
      text-align: center;
      white-space: nowrap;
    }
    .ticks span::before {
      content: "";
      display: block;
      width: 1px;
      height: 5px;
      margin: 0 auto 3px;
      background: var(--border);
    }

    .toggle-btn {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background .2s ease, transform .05s ease;
    }
    .toggle-btn:active { transform: scale(.99); }
    .toggle-btn.running { background: var(--stop); }

    .status {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-weight: 600;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Click Sound Timer</h1>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">🌙</button>
  </header>

  <p class="intro">
    Plays a short click sound on a repeating cycle. It starts automatically —
    drag the slider to set the period.
  </p>

  <div class="dial" id="dial">
    <svg viewBox="0 0 230 230" aria-hidden="true">
      <circle class="track" cx="115" cy="115" r="100" fill="none" stroke-width="14" />
      <circle class="progress" id="progress" cx="115" cy="115" r="100" fill="none" stroke-width="14" />
    </svg>
    <div class="center">
      <div class="count" id="count">10.0</div>
      <div class="unit" id="unit">of 10 s</div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <span class="label">Period</span>
      <span class="period-value"><span id="periodValue">10</span> s</span>
    </div>
    <input id="periodSlider" type="range" min="0" max="68" step="1" value="18" />
    <div class="ticks">
      <span style="left: calc(0% + 12px);">0.1</span>
      <span style="left: calc(13.235% + 8.82px);">1</span>
      <span style="left: calc(26.471% + 5.65px);">10</span>
      <span style="left: calc(55.882% - 1.41px);">30</span>
      <span style="left: calc(100% - 12px);">60</span>
    </div>

    <button id="toggleBtn" class="toggle-btn running">Stop</button>
    <div class="status" id="status">Running — click every 10 s</div>
  </div>

  <script>
    const slider     = document.getElementById("periodSlider");
    const periodValue= document.getElementById("periodValue");
    const toggleBtn  = document.getElementById("toggleBtn");
    const statusEl   = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const countEl    = document.getElementById("count");
    const unitEl     = document.getElementById("unit");
    const dial       = document.getElementById("dial");
    const themeToggle= document.getElementById("themeToggle");

    // Ring geometry: r = 100 -> circumference
    const R = 100;
    const C = 2 * Math.PI * R;
    progressEl.style.strokeDasharray = C;
    progressEl.style.strokeDashoffset = C;

    /* ---- Slider mapping ----
       Index 0..8   -> 0.1 .. 0.9 s   (0.1 s steps below 1 second)
       Index 9..68  -> 1 .. 60 s      (1 s steps from 1 second up, max 60) */
    function indexToPeriod(i) {
      i = Number(i);
      return i < 9 ? (i + 1) / 10 : i - 8;
    }
    function fmt(p) {
      return p < 1 ? p.toFixed(1) : String(Math.round(p));
    }
    function mod(a, m) {
      return ((a % m) + m) % m;
    }

    /* ---- State ---- */
    let period = indexToPeriod(slider.value);
    let running = true;
    let dragging = false;
    let wasRunning = true;
    let audioEnabled = false;
    let perfAnchor = performance.now() / 1000; // cycle start before audio is on
    let anchorTime = 0;                         // cycle start on the audio clock
    let lastProgress = 0;

    /* ---- Audio scheduling ----
       Clicks are pre-scheduled on the Web Audio clock, which runs on a separate
       thread — so playback keeps going even when the tab is backgrounded (where
       setInterval / requestAnimationFrame get throttled or paused). */
    let audioContext = null;
    let schedulerId = null;
    let nextNoteTime = 0;   // audio-clock time of the next click to schedule
    let scheduled = [];     // already-scheduled oscillators, so we can cancel them
    const SCHED_INTERVAL = 200;

    function clickAt(time) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(1000, time);
      gain.gain.setValueAtTime(0.4, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(time);
      osc.stop(time + 0.04);
      const entry = { osc };
      scheduled.push(entry);
      osc.onended = () => { scheduled = scheduled.filter((e) => e !== entry); };
    }

    function scheduler() {
      if (!running || !audioContext || audioContext.state !== "running") return;
      // Schedule far enough ahead that even a heavily throttled background tab
      // (timers clamped to ~1/min) always has the next click queued in time.
      const lookahead = Math.max(2, period * 2);
      while (nextNoteTime < audioContext.currentTime + lookahead) {
        clickAt(nextNoteTime);
        nextNoteTime += period;
      }
    }
    function startScheduler() {
      if (schedulerId === null) schedulerId = setInterval(scheduler, SCHED_INTERVAL);
    }
    function stopScheduler() {
      if (schedulerId !== null) { clearInterval(schedulerId); schedulerId = null; }
    }
    function cancelScheduled() {
      if (!audioContext) return;
      const now = audioContext.currentTime;
      scheduled.forEach((e) => { try { e.osc.stop(now); } catch (_) {} });
      scheduled = [];
    }

    /* ---- Visuals ---- */
    function setProgress(frac) {
      progressEl.style.strokeDashoffset = C * (1 - frac);
    }
    function pulse() {
      dial.classList.remove("pulse");
      void dial.offsetWidth; // restart animation
      dial.classList.add("pulse");
    }
    function renderStatic(frac, remaining) {
      setProgress(frac);
      countEl.textContent = remaining.toFixed(1);
      unitEl.textContent = "of " + fmt(period) + " s";
    }

    /* ---- Start / stop the cycle ---- */
    function start() {
      running = true;
      lastProgress = 0;
      if (audioEnabled && audioContext && audioContext.state === "running") {
        cancelScheduled();
        anchorTime = audioContext.currentTime;
        nextNoteTime = anchorTime; // click right away, then once per period
        startScheduler();
        scheduler();
        pulse();
      } else {
        perfAnchor = performance.now() / 1000;
      }
    }
    function stop() {
      running = false;
      stopScheduler();
      cancelScheduled();
    }

    /* ---- Audio enable / best-effort autoplay ---- */
    function markEnabled() {
      if (!audioEnabled) {
        audioEnabled = true;
        if (running) start(); // re-anchor onto the audio clock and click now
      }
      updateStatus();
    }
    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "running") markEnabled();
      else audioContext.resume().then(markEnabled).catch(() => {});
    }
    // Resume on the first gesture (autoplay fallback) and when returning to the tab.
    ["pointerdown", "keydown", "touchstart"].forEach((ev) =>
      window.addEventListener(ev, ensureAudio)
    );
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) ensureAudio();
    });

    /* ---- Animation loop (visual only; sound is scheduled separately) ---- */
    function frame() {
      if (running) {
        const useAudio = audioEnabled && audioContext && audioContext.state === "running";
        const t = useAudio ? audioContext.currentTime : performance.now() / 1000;
        const anchor = useAudio ? anchorTime : perfAnchor;
        const elapsed = mod(t - anchor, period);
        const progress = elapsed / period;
        if (progress < lastProgress) pulse(); // cycle wrapped → a click just fired
        lastProgress = progress;
        setProgress(progress);
        countEl.textContent = (period - elapsed).toFixed(1);
        unitEl.textContent = "of " + fmt(period) + " s";
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ---- Controls ---- */
    function setButtonRunning(isRunning) {
      toggleBtn.textContent = isRunning ? "Stop" : "Start";
      toggleBtn.classList.toggle("running", isRunning);
    }
    function updateStatus() {
      if (dragging) {
        statusEl.textContent = "Adjusting — " + fmt(period) + " s";
      } else if (running) {
        statusEl.textContent = "Running — click every " + fmt(period) + " s" +
          (audioEnabled ? "" : " · tap anywhere to enable sound");
      } else {
        statusEl.textContent = "Paused";
      }
    }

    // While dragging the slider, everything goes quiet, resets and stops.
    slider.addEventListener("input", () => {
      if (!dragging) {
        dragging = true;
        wasRunning = running;
      }
      stop();
      period = indexToPeriod(slider.value);
      periodValue.textContent = fmt(period);
      lastProgress = 0;
      renderStatic(0, period); // ring empty, full countdown, no sound
      updateStatus();
    });

    // On release, resume whatever state we were in, from a fresh cycle.
    slider.addEventListener("change", () => {
      dragging = false;
      if (wasRunning) {
        start();
      } else {
        renderStatic(0, period);
      }
      updateStatus();
    });

    toggleBtn.addEventListener("click", () => {
      ensureAudio();
      if (running) {
        stop();
        setButtonRunning(false);
      } else {
        start();
        setButtonRunning(true);
      }
      updateStatus();
    });

    /* ---- Theme ---- */
    function applyTheme(theme) {
      const light = theme === "light";
      document.body.classList.toggle("light", light);
      themeToggle.textContent = light ? "☀️" : "🌙";
    }
    let theme = "dark";
    try {
      theme = localStorage.getItem("timer-theme") || "dark";
    } catch (e) { /* localStorage unavailable */ }
    applyTheme(theme);

    themeToggle.addEventListener("click", () => {
      theme = document.body.classList.contains("light") ? "dark" : "light";
      applyTheme(theme);
      try { localStorage.setItem("timer-theme", theme); } catch (e) {}
    });

    // Initialise labels and try to start audio right away. If the browser
    // blocks autoplay it stays silent until the first gesture (tap anywhere).
    periodValue.textContent = fmt(period);
    renderStatic(0, period);
    updateStatus();
    ensureAudio();
  </script>
</body>
</html>
